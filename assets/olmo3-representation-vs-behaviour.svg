<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">OLMo3-7B-Instruct: Similar representations do not guarantee behavioural transfer</title><desc id="desc">Scatter plot of English-target cosine similarity at layer 14 against sycophancy reduction for Kazakh, Korean, Italian and Chinese, with 95 percent bootstrap confidence intervals.</desc><rect width="1200" height="760" fill="#fbfaf7"/><style>.t{font-family:Inter,Arial,sans-serif;fill:#1f2528}.m{fill:#687177}.axis{stroke:#9aa4aa;stroke-width:1.5}.grid{stroke:#c9ced0;stroke-dasharray:7 6}.p{fill:#5a91bf;stroke:#5a91bf}.pc{fill:#c63c2c;stroke:#c63c2c}.eb{stroke-width:3;fill:none}.lab{font-size:22px}.tick{font-size:18px}.title{font-size:28px;font-weight:700}.sub{font-size:20px}.ann{font-size:19px;fill:#c63c2c}</style><text x="110" y="44" class="t title">OLMo3-7B-Instruct: Similar representations do not guarantee behavioural transfer</text><text x="110" y="72" class="t m sub">Cross-lingual sycophancy steering at L14 (α = −1.5)</text><line x1="110" y1="650" x2="110" y2="120" class="axis"/><line x1="110" y1="650" x2="1080" y2="650" class="axis"/><line x1="110" y1="380" x2="1080" y2="380" class="grid"/><text x="70" y="386" class="t m tick">0</text><text x="57" y="275" class="t m tick">5</text><text x="46" y="165" class="t m tick">10</text><text x="45" y="490" class="t m tick">−5</text><text x="34" y="600" class="t m tick">−10</text><text x="108" y="685" class="t m tick">0.3</text><text x="274" y="685" class="t m tick">0.4</text><text x="440" y="685" class="t m tick">0.5</text><text x="606" y="685" class="t m tick">0.6</text><text x="772" y="685" class="t m tick">0.7</text><text x="938" y="685" class="t m tick">0.8</text><text x="1045" y="685" class="t m tick">0.9</text><text x="470" y="728" class="t lab">EN–target cosine similarity at L14 (sycophancy vectors)</text><text transform="translate(30 570) rotate(-90)" class="t lab">Sycophancy reduction at L14 (percentage points)</text><!-- Kazakh --><line x1="243" y1="306" x2="243" y2="583" class="p eb"/><line x1="233" y1="306" x2="253" y2="306" class="p eb"/><line x1="233" y1="583" x2="253" y2="583" class="p eb"/><circle cx="243" cy="490" r="11" class="p"/><text x="258" y="480" class="t lab">Kazakh</text><!-- Korean --><line x1="842" y1="282" x2="842" y2="545" class="p eb"/><line x1="832" y1="282" x2="852" y2="282" class="p eb"/><line x1="832" y1="545" x2="852" y2="545" class="p eb"/><circle cx="842" cy="435" r="11" class="p"/><text x="756" y="461" class="t lab">Korean</text><!-- Italian --><line x1="1025" y1="277" x2="1025" y2="636" class="p eb"/><line x1="1015" y1="277" x2="1035" y2="277" class="p eb"/><line x1="1015" y1="636" x2="1035" y2="636" class="p eb"/><circle cx="1025" cy="512" r="11" class="p"/><text x="949" y="538" class="t lab">Italian</text><!-- Chinese --><line x1="1085" y1="115" x2="1085" y2="462" class="pc eb"/><line x1="1075" y1="115" x2="1095" y2="115" class="pc eb"/><line x1="1075" y1="462" x2="1095" y2="462" class="pc eb"/><circle cx="1085" cy="281" r="12" class="pc"/><text x="1100" y="268" class="t lab">Chinese</text><rect x="720" y="130" width="325" height="92" rx="8" fill="#fbfaf7" stroke="#c63c2c" stroke-width="1.5"/><text x="735" y="158" class="ann">Highest cosine similarity,</text><text x="735" y="183" class="ann">but weak behavioural transfer</text><text x="735" y="208" class="ann">(4.5 pp reduction; CI includes zero)</text><line x1="940" y1="222" x2="1070" y2="270" class="pc eb"/><text x="130" y="376" class="t m tick">No effect</text><text x="46" y="746" class="t m tick">Error bars show 95% bootstrap CIs. Positive = sycophancy reduced; negative = sycophancy increased.</text></svg>